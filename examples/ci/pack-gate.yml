# 使用 modou pack 检查变更集的 GitHub Actions 示例。
#
# pack 纯静态运行，不连接数据库。
# verify、optimize 和 snapshot capture 需要本地快照，不应在托管 CI 中运行。
#
# 复制到 .github/workflows/pack-gate.yml，并按需修改 CHANGESET_DIR。
# 预警会写入 job summary；可按需增加破坏性语句检查。

name: modou-pack-gate

on:
  pull_request:
    paths:
      - "migrations/**" # 按仓库路径调整。

jobs:
  pack-warnings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install modou
        run: uv tool install modou

      - name: Pack changeset (static warnings, no DB)
        id: pack
        env:
          CHANGESET_DIR: migrations # 变更集目录，按仓库实际路径调整
        run: |
          set -euo pipefail
          modou pack "$CHANGESET_DIR" --report-json pack-warnings.json > /dev/null
          {
            echo "### 墨斗 pack 预警"
            echo '```'
            cat pack-warnings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 可选：发现高风险变更时阻断门禁。
      - name: Fail on destructive warnings
        run: |
          set -euo pipefail
          # 独立重跑时也要求预警文件存在。
          [ -f pack-warnings.json ] || { echo "::error::pack-warnings.json missing"; exit 1; }
          if grep -q '"level": "high"' pack-warnings.json; then
            echo "::error::destructive changes detected (see pack warnings summary)"
            exit 1
          fi
