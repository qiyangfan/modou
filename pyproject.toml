[project]
name = "modou"
version = "1.0.0"
description = "墨斗：数据库工程化的本地层——变更验收、SQL 优化、规则审核、漂移洞察"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # 为 PyMySQL 的 MySQL 8 默认认证提供运行时依赖。
    "cryptography>=42.0",
    "pymysql>=1.1",
    "sqlglot>=25.0",
    "typer>=0.12",
]

[project.scripts]
modou = "modou.cli:app"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4,<5",
]

[dependency-groups]
dev = [
    "fastmcp>=4,<5",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modou"]

# 将 UI 构建产物随 Python 包分发，运行时不依赖 Node。
# 打包前运行 `cd ui && npm run build`；ui/dist 不纳入 Git。
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "src/modou/ui/dist"

[tool.hatch.build.targets.sdist.force-include]
"ui/dist" = "ui/dist"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 保留中文注释和文档中的全角标点。
ignore = ["RUF001", "RUF002", "RUF003"]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warning
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 专属
]

[tool.ruff.lint.per-file-ignores]
# Typer 要求默认值通过 Option()/Argument() 声明；忽略该文件的 B008。
"src/modou/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_byok_env: 保留真实 BYOK 环境变量（评测门禁专用，其余用例默认剥离）",
]
