[project]
name = "modou"
version = "1.0.0"
description = "墨斗：数据库工程化的本地层——变更验收、SQL 优化、规则审核、漂移洞察"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # 为 PyMySQL 的 MySQL 8 默认认证提供运行时依赖。
    "cryptography>=42.0",
    "pymysql>=1.1",
    "sqlglot>=25.0",
    "typer>=0.12",
]

[project.scripts]
modou = "modou.cli:app"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4,<5",
]

[dependency-groups]
dev = [
    "fastmcp>=4,<5",
    "import-linter>=2.2",
    "pylint>=3.3",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modou"]

# 将 UI 构建产物随 Python 包分发，运行时不依赖 Node。
# 打包前运行 `cd ui && npm run build`；ui/dist 不纳入 Git。
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "src/modou/ui/dist"

[tool.hatch.build.targets.sdist.force-include]
"ui/dist" = "ui/dist"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 保留中文注释和文档中的全角标点。
ignore = ["RUF001", "RUF002", "RUF003"]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warning
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 专属
    "TID",     # 导入卫生（禁父级相对导入）
    "C901",    # 圈复杂度（默认 10）
    "PLR0912", # 分支数（默认 12）
    "PLR0915", # 语句数（默认 50）
    "PLW",     # 常见错误模式（未检查的 subprocess、循环变量覆盖等）
    "PERF",    # 低效写法
    "C4",      # 冗余推导式/容器构造
    "RET",     # 冗余 return
    "T10",     # 禁止调试断点
    "T20",     # 禁止 print
]

[tool.ruff.lint.per-file-ignores]
# Typer 要求默认值通过 Option()/Argument() 声明；忽略该文件的 B008。
"src/modou/cli.py" = ["B008"]

[tool.importlinter]
root_packages = ["modou"]

# 内核只承载业务逻辑；CLI/MCP/UI 是表面层，反向依赖会破坏 ADR-0002 的层次。
[[tool.importlinter.contracts]]
name = "内核不依赖表面层（ADR-0002）"
type = "forbidden"
source_modules = [
    "modou.changeset",
    "modou.snapshot",
    "modou.replay",
    "modou.diff",
    "modou.optimize",
    "modou.lint",
    "modou.patrol",
    "modou.report",
    "modou.ai",
    "modou.params",
    "modou.db",
]
forbidden_modules = ["modou.cli", "modou.server", "modou.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_byok_env: 保留真实 BYOK 环境变量（评测门禁专用，其余用例默认剥离）",
]
