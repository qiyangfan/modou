[project]
name = "modou"
version = "1.0.0"
description = "墨斗：数据库工程化的本地层——变更验收、SQL 优化、规则审核、漂移洞察"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # 源码零 import：pymysql caching_sha2_password（MySQL 8 默认认证）的运行时伴随依赖，禁止误删
    "cryptography>=42.0",
    "pymysql>=1.1",
    "sqlglot>=25.0",
    "typer>=0.12",
]

[project.scripts]
modou = "modou.cli:app"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4,<5",
]

[dependency-groups]
dev = [
    "fastmcp>=4,<5",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modou"]

# 前端构建产物随 Python 包分发：运行期零 Node 依赖（v0.4c design §2）。
# sdist 同款 force-include：下游从 sdist 构建 wheel 时产物必须随源码发行版在场
# （ui/dist 不入 git，打包前置与 wheel 相同：cd ui && npm run build）
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "src/modou/ui/dist"

[tool.hatch.build.targets.sdist.force-include]
"ui/dist" = "ui/dist"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# RUF001/002/003 禁用：中文注释/文档的全角标点是本仓刻意的排版规范（AGENTS.md），非歧义缺陷
ignore = ["RUF001", "RUF002", "RUF003"]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warning
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 专属
]

[tool.ruff.lint.per-file-ignores]
# typer 的参数默认值必须是 Option()/Argument() 调用，B008 为框架性误报
"src/modou/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_byok_env: 保留真实 BYOK 环境变量（评测门禁专用，其余用例默认剥离）",
]
