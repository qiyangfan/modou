[project]
name = "modou"
version = "0.1.0"
description = "墨斗：数据库工程化的本地层——变更验收、SQL 优化、规则审核、漂移洞察"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "pymysql>=1.1",
    "sqlglot>=25.0",
    "typer>=0.12",
]

[project.scripts]
modou = "modou.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modou"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# RUF001/002/003 禁用：中文注释/文档的全角标点是本仓刻意的排版规范（AGENTS.md），非歧义缺陷
ignore = ["RUF001", "RUF002", "RUF003"]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warning
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 专属
]

[tool.ruff.lint.per-file-ignores]
# typer 的参数默认值必须是 Option()/Argument() 调用，B008 为框架性误报
"src/modou/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
