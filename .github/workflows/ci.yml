name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python 内核门禁
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # 3.12 是项目支持的最低版本。
          python-version: "3.12"
          enable-cache: true
      # Python 包含 UI 资源，安装前需先生成构建产物。
      - name: Build UI assets
        run: npm ci --prefix ui && npm run build --prefix ui
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # 体积门禁（kongming 同口径：pylint 默认阈值 1000 行 / 20 个公有方法）。
      - run: uv run pylint --disable=all --enable=too-many-lines,too-many-public-methods --jobs=0 src/modou
      # 分层门禁：内核不得反向依赖 CLI/MCP/UI（ADR-0002）。
      - run: uv run lint-imports
      - run: uv run pytest -q
      - name: CLI 冒烟
        run: uv run modou --help

  # UI 目录不存在时跳过前端门禁。
  # hashFiles 仅 step 级可用,目录存在性判定须由独立 job 输出。
  ui-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -d ui ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  ui:
    needs: ui-detect
    if: needs.ui-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm test --if-present
