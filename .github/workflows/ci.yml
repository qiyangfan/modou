name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python 内核门禁
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # 3.12 是项目支持的最低版本。
          python-version: "3.12"
          enable-cache: true
      # Python 包含 UI 资源，安装前需先生成构建产物。
      - name: Build UI assets
        run: npm ci --prefix ui && npm run build --prefix ui
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: CLI 冒烟
        run: uv run modou --help

  # UI 目录不存在时跳过前端门禁。
  ui-detect:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -d ui ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  ui:
    needs: ui-detect
    if: needs.ui-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm test --if-present
