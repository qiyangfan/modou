name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁 1：Python 内核（与 AGENTS.md 门禁命令单源） ──────────────
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # 3.12 = requires-python 地板，保地板可装；本地开发用 3.13 亦可
          python-version: "3.12"
          enable-cache: true
      # ui/dist 是 hatch force-include 的硬前置（uv sync 走 editable 构建同路径），
      # 内核门禁在安装前先产出前端构建产物（产物不入库，见 .gitignore 注释）
      - name: Build UI assets
        run: npm ci --prefix ui && npm run build --prefix ui
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: CLI 冒烟
        run: uv run modou --help

  # ── 门禁 2：薄报告层（预留位） ────────────────────────────────────
  # ui/ 落地（v0.4）前自动跳过；落地后按家族惯例换 pnpm
  # （参考 muniu web-check：pnpm/action-setup + package_json_file 指向 ui/）。
  # Node 版本 = 家族 web 门禁标准：24（muniu/kongming 同款）。
  # 注意：hashFiles 只能用于 step 级 if，job 级跳过须走 needs outputs。
  ui-detect:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -d ui ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  ui:
    needs: ui-detect
    if: needs.ui-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm test --if-present
