name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 独立于 ci.yml：避免路径/条件裁剪让安全作业被跳过。
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

  # 依赖漏洞扫描：Python 走 PyPI 公告库，Node 走 npm audit（high 及以上即失败）。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      # 本项目自身是可编辑安装，PyPI 上没有对应发布物，跳过只审计第三方依赖。
      - run: uv run pip-audit --skip-editable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix ui
      - run: npm audit --prefix ui --audit-level=high

  # 锁定文件漏洞扫描：与包管理器审计互补，覆盖 Python/Node 锁文件的完整依赖图。
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: osv-scanner
        run: |
          VERSION=2.7.1
          BASE="https://github.com/google/osv-scanner/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/osv-scanner_SHA256SUMS" -o /tmp/osv.sha256
          curl -sSfL "${BASE}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          (cd /tmp && grep " osv-scanner_linux_amd64\$" osv.sha256 | sha256sum --check)
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -r .

  # SBOM 与许可证合规：生成 CycloneDX 制品并留存，allowlist 之外（默认 deny-all）
  # 的许可证直接失败。开发期工具的无宽松替代豁免见 .grant.yaml。
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 许可证元数据只存在于已安装的包信息中，必须先装好依赖。
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --prefix ui
      - name: 安装 syft
        run: |
          set -euo pipefail
          VERSION=1.57.2
          ASSET="syft_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/syft/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSfL "${BASE}/syft_${VERSION}_checksums.txt" -o /tmp/syft.sha256
          # 校验和与产物同源发布：拦下载损坏与发布元数据不一致。
          (cd /tmp && sha256sum -c <(grep "  ${ASSET}\$" syft.sha256))
          tar -xz -C /usr/local/bin -f "/tmp/${ASSET}" syft
      - name: 生成 SBOM（CycloneDX）
        run: syft scan dir:. -c .syft.yaml -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
      - name: 安装 grant
        run: |
          set -euo pipefail
          VERSION=0.8.0
          ASSET="grant_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/grant/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSfL "${BASE}/grant_${VERSION}_checksums.txt" -o /tmp/grant.sha256
          (cd /tmp && sha256sum -c <(grep "  ${ASSET}\$" grant.sha256))
          tar -xz -C /usr/local/bin -f "/tmp/${ASSET}" grant
      - name: 许可证策略（allowlist；强 copyleft 即阻断）
        run: grant check sbom.cdx.json
