repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # 快检：仅作用于本次提交的 Python 文件。
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      # 全量检查：UI 与文档体量小，整树扫描耗时可接受。
      - id: ui-eslint
        name: eslint (ui)
        entry: npm run lint --prefix ui
        language: system
        pass_filenames: false
      - id: ui-stylelint
        name: stylelint (ui)
        entry: npm run style:check --prefix ui
        language: system
        pass_filenames: false
      - id: docs-prettier
        name: prettier (docs)
        entry: npm run docs:format:check --prefix ui
        language: system
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        entry: npm run docs:check --prefix ui
        language: system
        pass_filenames: false
      - id: toml-format
        name: taplo fmt
        entry: taplo fmt --check
        language: system
        types: [toml]
      - id: vulture
        name: vulture
        entry: uv run vulture src tests --min-confidence 100
        language: system
        pass_filenames: false
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: uv run yamllint -f parsable .github openspec examples/ci/pack-gate.yml .pre-commit-config.yaml .yamllint.yml
        language: system
        pass_filenames: false
      - id: ui-dead-code
        name: knip (ui)
        entry: npm run dead:check --prefix ui
        language: system
        pass_filenames: false
      - id: commitlint
        name: commitlint
        entry: bash -c 'cd ui && exec node_modules/.bin/commitlint --config commitlint.config.mjs --edit "$1"' _
        language: system
        stages: [commit-msg]
      # 慢检：项目级类型检查放 pre-push，避免拖慢提交。
      - id: zizmor
        name: zizmor
        entry: uv run zizmor .github/workflows
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy
        name: mypy
        entry: uv run mypy src/modou
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ui-typecheck
        name: tsc (ui)
        entry: npm run typecheck --prefix ui
        language: system
        pass_filenames: false
        stages: [pre-push]
